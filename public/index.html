<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Try-On demo</title>
<style>
  body{font:16px system-ui;margin:0;background:#faf9f7;color:#1b1b1f}
  header{padding:28px 24px 8px;max-width:960px;margin:auto}
  h1{margin:0 0 6px;font-size:28px}p{color:#666;margin:0}
  .grid{max-width:960px;margin:20px auto;padding:0 24px 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  figure{margin:0;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee}
  figure img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
  figcaption{padding:10px 12px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>AI Try-On demo</h1>
  <p>Open the widget, start your camera, then drag any outfit photo (from this page, Pinterest, Zara, Shopee…) into the window.</p>
</header>
<main class="grid">
  <figure><img class="product" src="/demo/jacket.jpg" alt="Jacket"><figcaption>Brown jacket</figcaption></figure>
  <figure><img class="product" src="/demo/blazer.jpg" alt="Blazer"><figcaption>Burgundy blazer</figcaption></figure>
  <figure><img class="product" src="/demo/tee.jpg" alt="Tee"><figcaption>Blue tee</figcaption></figure>
</main>

<!-- ===== the only two lines you need on your own site ===== -->
<script src="/tryon-widget.js" defer></script>
<ai-tryon api="/api"></ai-tryon>
<script>addEventListener('DOMContentLoaded', () => AITryOn.attach('img.product'));</script>
</body>
</html>
